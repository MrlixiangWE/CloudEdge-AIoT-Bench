<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- hexagonal badge -->
  <path filter="url(#shadow)" fill="url(#bg)"
        d="M128 12 L228 70 Q236 75 236 84 L236 172 Q236 181 228 186 L128 244 Q128 244 128 244 L28 186 Q20 181 20 172 L20 84 Q20 75 28 70 Z"/>
  <path fill="url(#glow)"
        d="M128 12 L228 70 Q236 75 236 84 L236 172 Q236 181 228 186 L128 244 L28 186 Q20 181 20 172 L20 84 Q20 75 28 70 Z"/>

  <!-- cloud tier -->
  <path fill="url(#cloud)"
        d="M84 104 a22 22 0 0 1 4-43.6 a30 30 0 0 1 56-8 a24 24 0 0 1 36 21 a16 16 0 0 1 -4 30.6 Z"/>
  <circle cx="108" cy="86" r="5" fill="#4F46E5"/>
  <circle cx="132" cy="80" r="5" fill="#2563EB"/>
  <circle cx="156" cy="86" r="5" fill="#0891B2"/>
  <path d="M108 86 L132 80 L156 86" stroke="#4F46E5" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- cloud-edge links -->
  <g stroke="#E0F2FE" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9" fill="none">
    <path d="M100 106 L72 162"/>
    <path d="M128 106 L128 162"/>
    <path d="M156 106 L184 162"/>
  </g>

  <!-- edge / AIoT devices: three chips -->
  <g fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2">
    <rect x="54" y="160" width="36" height="36" rx="8"/>
    <rect x="110" y="160" width="36" height="36" rx="8"/>
    <rect x="166" y="160" width="36" height="36" rx="8"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
    <path d="M62 156 v-5 M72 156 v-5 M82 156 v-5 M62 200 v5 M72 200 v5 M82 200 v5"/>
    <path d="M118 156 v-5 M128 156 v-5 M138 156 v-5 M118 200 v5 M128 200 v5 M138 200 v5"/>
    <path d="M174 156 v-5 M184 156 v-5 M194 156 v-5 M174 200 v5 M184 200 v5 M194 200 v5"/>
  </g>
  <!-- sensing glyphs: signal, camera, IMU -->
  <path d="M60 179 h7 l4 -9 l6 18 l4 -9 h7" stroke="#4F46E5" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round">
    <rect x="117" y="171" width="22" height="15" rx="3"/>
    <circle cx="128" cy="178.5" r="4"/>
  </g>
  <g stroke="#0891B2" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M184 166 v24 M172 178 h24"/>
    <circle cx="184" cy="178" r="6"/>
  </g>
</svg>
