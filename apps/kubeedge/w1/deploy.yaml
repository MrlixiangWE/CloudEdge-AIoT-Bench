apiVersion: apps/v1
kind: Deployment
metadata:
  name: w1-load-signal
  labels: {app: w1-load-signal}
spec:
  replicas: 4
  selector:
    matchLabels: {app: w1-load-signal}
  template:
    metadata:
      labels: {app: w1-load-signal}
    spec:
      nodeSelector:
        hedices.io/tier: edge
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - name: stage
        image: aiot-bench/w1-base:latest
        imagePullPolicy: IfNotPresent
        env:
        - {name: STAGE, value: load_signal}
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: w1-load-signal
spec:
  selector: {app: w1-load-signal}
  ports:
  - port: 80
    targetPort: 8080
---
