apiVersion: apps/v1
kind: Deployment
metadata:
  name: w2-read-frame
  labels: {app: w2-read-frame}
spec:
  replicas: 4
  selector:
    matchLabels: {app: w2-read-frame}
  template:
    metadata:
      labels: {app: w2-read-frame}
    spec:
      nodeSelector:
        hedices.io/tier: edge
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - name: stage
        image: aiot-bench/w2-base:latest
        imagePullPolicy: IfNotPresent
        env:
        - {name: STAGE, value: read_frame}
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: w2-read-frame
spec:
  selector: {app: w2-read-frame}
  ports:
  - port: 80
    targetPort: 8080
---
