apiVersion: apps/v1
kind: Deployment
metadata:
  name: w2-retrack
  labels: {app: w2-retrack}
spec:
  replicas: 2
  selector:
    matchLabels: {app: w2-retrack}
  template:
    metadata:
      labels: {app: w2-retrack}
    spec:
      nodeSelector:
        hedices.io/tier: cloud
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - name: stage
        image: aiot-bench/w2-onnx:latest
        imagePullPolicy: IfNotPresent
        env:
        - {name: STAGE, value: retrack}
        - {name: OMP_NUM_THREADS, value: "2"}  # native threads = CPU request
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "2", memory: 1Gi}
        readinessProbe:  # ready once the model is loaded and the port opens
          tcpSocket: {port: 8080}
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: w2-retrack
spec:
  selector: {app: w2-retrack}
  ports:
  - port: 80
    targetPort: 8080
---
