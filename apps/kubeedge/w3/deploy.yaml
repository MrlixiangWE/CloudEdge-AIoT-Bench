apiVersion: apps/v1
kind: Deployment
metadata:
  name: w3-infer
  labels: {app: w3-infer}
spec:
  replicas: 4
  selector:
    matchLabels: {app: w3-infer}
  template:
    metadata:
      labels: {app: w3-infer}
    spec:
      nodeSelector:
        hedices.io/tier: edge
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - name: stage
        image: aiot-bench/w3-torch:latest
        imagePullPolicy: IfNotPresent
        env:
        - {name: STAGE, value: infer}
        - {name: OMP_NUM_THREADS, value: "2"}  # native threads = CPU request
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "2", memory: 2Gi}
        readinessProbe:  # ready once the model is loaded and the port opens
          tcpSocket: {port: 8080}
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: w3-infer
spec:
  selector: {app: w3-infer}
  ports:
  - port: 80
    targetPort: 8080
---
