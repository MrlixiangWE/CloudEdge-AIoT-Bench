apiVersion: apps/v1
kind: Deployment
metadata:
  name: w3-load-image
  labels: {app: w3-load-image}
spec:
  replicas: 2
  selector:
    matchLabels: {app: w3-load-image}
  template:
    metadata:
      labels: {app: w3-load-image}
    spec:
      nodeSelector:
        hedices.io/tier: cloud
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - name: stage
        image: aiot-bench/w3-base:latest
        imagePullPolicy: IfNotPresent
        env:
        - {name: STAGE, value: load_image}
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: w3-load-image
spec:
  selector: {app: w3-load-image}
  ports:
  - port: 80
    targetPort: 8080
---
