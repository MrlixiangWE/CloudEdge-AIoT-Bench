apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: w2-read-frame
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "2"
    spec:
      nodeSelector:
        hedices.io/tier: cloud
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - image: aiot-bench/w2-base:latest
        env:
        - {name: STAGE, value: read_frame}
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "1", memory: 1Gi}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: w2-preprocess
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "4"
    spec:
      nodeSelector:
        hedices.io/tier: edge
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - image: aiot-bench/w2-base:latest
        env:
        - {name: STAGE, value: preprocess}
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "1", memory: 512Mi}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: w2-retrack
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "4"
    spec:
      containerConcurrency: 1  # one call at a time per model replica
      nodeSelector:
        hedices.io/tier: edge
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - image: aiot-bench/w2-onnx:latest
        env:
        - {name: STAGE, value: retrack}
        - {name: OMP_NUM_THREADS, value: "2"}  # native threads = CPU request
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "2", memory: 1Gi}
---
