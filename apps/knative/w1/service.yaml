apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: w1-load-signal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "4"
    spec:
      nodeSelector:
        hedices.io/tier: edge
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - image: aiot-bench/w1-base:latest
        env:
        - {name: STAGE, value: load_signal}
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "1", memory: 1Gi}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: w1-preproc
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "4"
    spec:
      nodeSelector:
        hedices.io/tier: edge
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - image: aiot-bench/w1-base:latest
        env:
        - {name: STAGE, value: preproc}
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "2", memory: 1Gi}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: w1-recognize
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "4"
    spec:
      containerConcurrency: 1  # one call at a time per model replica
      nodeSelector:
        hedices.io/tier: edge
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - image: aiot-bench/w1-torch:latest
        env:
        - {name: STAGE, value: recognize}
        - {name: OMP_NUM_THREADS, value: "2"}  # native threads = CPU request
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "2", memory: 2Gi}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: w1-aggregate
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "2"
    spec:
      nodeSelector:
        hedices.io/tier: cloud
      tolerations:  # leave a failed node after 5 s instead of the default 300 s
      - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 5}
      containers:
      - image: aiot-bench/w1-base:latest
        env:
        - {name: STAGE, value: aggregate}
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: "1", memory: 512Mi}
